name: Validate provider contribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  inert-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Validation code must come from the reviewed base revision, never from the
      # contribution. This workflow therefore needs to exist on the default
      # branch before it can validate the first contribution.
      - name: Check out trusted registry tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-registry
          persist-credentials: false
      - name: Check out candidate registry metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-registry
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Validate inert contribution metadata
        run: >-
          sh trusted-registry/scripts/ci/validate-provider-contribution.sh
          trusted-registry/ci/released-cli.env
          trusted-registry
          candidate-registry
          validate
      # Do not download or execute contributor archives here. Publisher identity,
      # source provenance, and publication authority require maintainer review and
      # protected publication-time revalidation; this unprivileged PR job proves
      # only the structural and immutable-history contribution policy.

  contributor-tooling:
    # Pending release provisioning, this preserves the legacy PR-controlled tests.
    # Once pinned, the trusted released CLI replaces them without changing the
    # required-check name. The job has no secrets, write permission, protected
    # environment, cache, or artifact handoff in either mode.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted registry tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-registry
          persist-credentials: false
      - name: Check out candidate registry tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-registry
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Test legacy tooling or build index with the pinned released CLI
        run: >-
          sh trusted-registry/scripts/ci/validate-provider-contribution.sh
          trusted-registry/ci/released-cli.env
          trusted-registry
          candidate-registry
          tooling
      # Neither mode establishes publisher identity, provenance, or publication
      # authority, and neither may download or execute provider archives.
