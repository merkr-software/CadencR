name: Publish protected marketplace catalog

on:
  workflow_dispatch:
    inputs:
      confirm-request-sha256:
        description: SHA-256 of the reviewed publication-request.json at the dispatched commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Confirm reviewed publication request
        env:
          CONFIRM_REQUEST_SHA256: ${{ inputs.confirm-request-sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync } = require("node:fs");
          const file = "publication-request.json";
          const expected = process.env.CONFIRM_REQUEST_SHA256;
          if (!/^[a-f0-9]{64}$/.test(expected ?? "")) {
            throw new Error("confirm-request-sha256 must be 64 lowercase hexadecimal characters");
          }
          const metadata = lstatSync(file);
          if (metadata.isSymbolicLink() || !metadata.isFile()) {
            throw new Error("publication-request.json must be a regular non-symlink file");
          }
          if (metadata.size > 1024 * 1024) {
            throw new Error("publication-request.json exceeds 1 MiB");
          }
          // The fixed request lives in this isolated, exact-commit checkout;
          // no contributor process runs concurrently between this cap and read.
          const bytes = readFileSync(file);
          const actual = createHash("sha256").update(bytes).digest("hex");
          if (actual !== expected) throw new Error("reviewed publication request digest mismatch");
          require("./scripts/ci/confirm-provider-handoffs.cjs").confirmHandoffs(JSON.parse(bytes.toString("utf8")));
          NODE

      - name: Select verified publisher runtime
        id: publisher_runtime
        env:
          CLI_ROOT: ${{ runner.temp }}/marketplace-released-cli
        run: sh scripts/ci/select-publisher-runtime.sh

  publish:
    needs: preflight
    if: needs.preflight.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Repository administrators must configure this environment with required
    # external reviewers. The workflow cannot provision that protection itself.
    environment: protected-marketplace-publisher
    runs-on: ubuntu-latest
    # Each public read-back may wait out the raw CDN's 300 s cache: up to about
    # six minutes per published file.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Reconfirm reviewed publication request
        env:
          CONFIRM_REQUEST_SHA256: ${{ inputs.confirm-request-sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync } = require("node:fs");
          const file = "publication-request.json";
          const expected = process.env.CONFIRM_REQUEST_SHA256;
          if (!/^[a-f0-9]{64}$/.test(expected ?? "")) {
            throw new Error("confirm-request-sha256 must be 64 lowercase hexadecimal characters");
          }
          const metadata = lstatSync(file);
          if (metadata.isSymbolicLink() || !metadata.isFile() || metadata.size > 1024 * 1024) {
            throw new Error("publication-request.json must be a bounded regular non-symlink file");
          }
          const actual = createHash("sha256").update(readFileSync(file)).digest("hex");
          if (actual !== expected) throw new Error("reviewed publication request digest mismatch");
          require("./scripts/ci/confirm-provider-handoffs.cjs").confirmHandoffs(JSON.parse(readFileSync(file, "utf8")));
          NODE
      - name: Select verified publisher runtime
        id: publisher_runtime
        env:
          CLI_ROOT: ${{ runner.temp }}/marketplace-released-cli
        run: sh scripts/ci/select-publisher-runtime.sh
      - name: Create bounded publication state directory
        env:
          PUBLICATION_STATE: ${{ runner.temp }}/marketplace-publication-state
        run: >-
          node -e 'require("node:fs").mkdirSync(process.env.PUBLICATION_STATE,
          { recursive: false, mode: 0o700 })'
      - name: Materialize protected signing key
        id: materialize_key
        env:
          CADENCR_REGISTRY_PRIVATE_KEY_PEM: ${{ secrets.CADENCR_REGISTRY_PRIVATE_KEY_PEM }}
          PRIVATE_KEY_ROOT: ${{ runner.temp }}
        run: sh scripts/ci/registry-feeds.sh materialize-key marketplace-publisher-secret-
      - name: Publish reviewed registry request
        env:
          CADENCR_REGISTRY_GITHUB_TOKEN: ${{ secrets.CADENCR_REGISTRY_GITHUB_TOKEN }}
          CONFIRM_REQUEST_SHA256: ${{ inputs.confirm-request-sha256 }}
          PRIVATE_KEY_FILE: ${{ steps.materialize_key.outputs.private_key_file }}
          VERIFIED_CLI: ${{ steps.publisher_runtime.outputs.cli_file }}
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const { join } = require("node:path");
          const args = [
            "--request", "publication-request.json",
            "--directory", join(process.env.RUNNER_TEMP, "marketplace-publication-state"),
            "--repository", process.env.GITHUB_REPOSITORY,
            "--registry-commit", process.env.GITHUB_SHA,
            "--private-key", process.env.PRIVATE_KEY_FILE,
            "--confirm-request-sha256", process.env.CONFIRM_REQUEST_SHA256,
          ];
          const command = process.env.VERIFIED_CLI;
          const prefix = ["registry", "publish-registry"];
          if (!command) throw new Error("missing verified CLI");
          const result = spawnSync(command, [...prefix, ...args], { stdio: "inherit" });
          if (result.error) throw result.error;
          if (result.status !== 0) throw new Error("registry publication failed");
          NODE
      - name: Remove materialized signing key
        if: ${{ always() && steps.materialize_key.outputs.private_key_file != '' }}
        env:
          PRIVATE_KEY_FILE: ${{ steps.materialize_key.outputs.private_key_file }}
          PRIVATE_KEY_ROOT: ${{ runner.temp }}
        run: sh scripts/ci/registry-feeds.sh remove-key marketplace-publisher-secret-
      # Fresh runners reconstruct published provider state only after tag,
      # binding, public provenance and archive verification. No Actions artifact
      # is restored or executed. Reruns retain the original reviewed commit,
      # request and publication window; expiry still fails closed. Unpublished
      # drafts require source archives when no local staging state survives.
      # Raw recovery state is not uploaded: it is not publication authority.
