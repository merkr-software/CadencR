[package]
name = "cadencr-service"
version = "0.6.7"
edition = "2021"
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
claude-agent-sdk-rs = { path = "../claude-agent-sdk-rs" }
cli-discovery = { path = "../cli-discovery" }
codex-app-server-sdk-rs = { path = "../codex-app-server-sdk-rs" }
opencode-sdk-rs = { path = "../opencode-sdk-rs" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "compression-br", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
agent-client-protocol = "1.2.0"
regex-lite = "0.1"
dirs = "6"
rand = "0.10"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
rmcp = { version = "1", features = ["server", "transport-streamable-http-server", "transport-io", "elicitation"] }
dashmap = "6"
libc = "0.2"
portable-pty = "0.9"
ignore = "0.4"
nucleo-matcher = "0.3"
notify-debouncer-mini = "0.7"
dotenvy = "0.15"
tempfile = "3"
trash = "5"
flate2 = "1"
sha2 = "0.11"
# `web-push` depends on `ece -> openssl`. In release builds that previously
# linked the sidecar against Homebrew's `/opt/homebrew/opt/openssl@3` dylibs,
# which are not present on user machines. Enable OpenSSL's vendored build so
# the packaged service is self-contained.
openssl = { version = "0.10", features = ["vendored"] }
# Remote access: self-signed TLS listener + device-token auth.
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls"] }
# Pin the `ring` crypto provider explicitly (installed at remote startup) so TLS
# is deterministic regardless of what else pulls rustls into the tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
subtle = "2.6"
if-addrs = "0.13"
# Web Push (PWA/remote background notifications): VAPID signing + RFC 8291
# payload encryption. `hyper-client` avoids the default isahc/libcurl backend;
# hyper-tls uses native-tls, already pulled in by reqwest. `jwt-simple`
# (pure-rust, the same crate web-push uses for ES256) generates the VAPID keypair.
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[lints]
workspace = true

[dev-dependencies]
assert-json-diff = "2"
tower = { version = "0.5", features = ["util"] }
# `rustls-tls` is dev-only: the remote-listener test needs a rustls client to
# talk to our rustls server (macOS Secure Transport mis-negotiates against it).
# Dev-dependency features don't leak into the shipped binary, which keeps
# native-tls.
reqwest = { version = "0.12", features = ["rustls-tls"] }
