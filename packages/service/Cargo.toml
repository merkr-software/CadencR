[package]
name = "cadencr-service"
version = "0.3.1"
edition = "2021"
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
claude-agent-sdk-rs = { path = "../claude-agent-sdk-rs" }
cli-discovery = { path = "../cli-discovery" }
codex-app-server-sdk-rs = { path = "../codex-app-server-sdk-rs" }
opencode-sdk-rs = { path = "../opencode-sdk-rs" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
agent-client-protocol = "0.11.1"
regex-lite = "0.1"
dirs = "6"
rand = "0.8"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
rmcp = { version = "1", features = ["server", "transport-streamable-http-server", "transport-io", "elicitation"] }
dashmap = "6"
libc = "0.2"
portable-pty = "0.9"
ignore = "0.4"
nucleo-matcher = "0.3"
notify-debouncer-mini = "0.7"
dotenvy = "0.15"
tempfile = "3"
trash = "5"
flate2 = "1"
sha2 = "0.10"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[lints]
workspace = true

[dev-dependencies]
assert-json-diff = "2"
tower = { version = "0.5", features = ["util"] }
