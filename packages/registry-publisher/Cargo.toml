[package]
name = "cadencr-registry-publisher"
version = "0.16.0"
edition = "2021"
license.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4"
bon.workspace = true
bytes = "1"
futures = "0.3"
percent-encoding = "2"
tokio = { version = "1", features = ["rt"] }
cadencr-registry-core = { path = "../registry-core" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha1 = "0.11"
sha2 = "0.11"
url = "2"
tempfile = "3"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
cadencr-plugin-core = { path = "../plugin-core", features = ["test-support"] }
