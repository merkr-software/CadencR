[package]
name = "cadencr-registry-publisher"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
base64 = "0.23.1"
bon.workspace = true
cadencr-registry-core = { path = "../registry-core" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha1 = "0.11"
sha2 = "0.11"
url = "2"
tempfile = "3"

[lints]
workspace = true
