[package]
name = "cadencr-cli"
version = "0.11.5"
edition = "2021"
license.workspace = true

[[bin]]
name = "cadencr"
path = "src/main.rs"

[dependencies]
bon.workspace = true
cadencr-plugin-core = { path = "../plugin-core" }
cadencr-registry-core = { path = "../registry-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
chrono = "0.4"

[lints]
workspace = true
