[package]
name = "cadencr-cli"
version = "0.12.1"
edition = "2021"
license.workspace = true

[[bin]]
name = "cadencr"
path = "src/main.rs"

[dependencies]
bon.workspace = true
cadencr-plugin-core = { path = "../plugin-core" }
cadencr-registry-core = { path = "../registry-core" }
cadencr-registry-publisher = { path = "../registry-publisher" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
flate2 = "1"
libc = "0.2"
sha2 = "0.11"
chrono = "0.4"

[lints]
workspace = true
