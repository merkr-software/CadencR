[package]
name = "cadencr-plugin-core"
version = "0.16.0"
edition = "2021"
license.workspace = true

[dependencies]
bon.workspace = true
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
