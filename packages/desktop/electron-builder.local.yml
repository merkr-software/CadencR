appId: com.cadencr.desktop
productName: Cadencr
icon: icons/icon
directories:
  output: dist-electron
files:
  - out/**/*
  # The built SPA ships once, as extraResources `renderer/` below. Excluding it
  # from the asar avoids a ~44 MB duplicate; the packaged window loads it from
  # `process.resourcesPath/renderer` (see `rendererLoadUrl`).
  - "!out/renderer/**"
  - package.json
extraResources:
  - from: icons/512x512.png
    to: icons/512x512.png
  - from: resources/bin/cadencr-service
    to: cadencr-service
  # The built SPA on the real filesystem — loaded directly by the packaged
  # window and served over the remote listener.
  - from: out/renderer
    to: renderer
mac:
  # Intentionally NOT setting `identity: null` — that disables codesign
  # entirely, and macOS UNUserNotificationCenter then refuses to register
  # the bundle (every `new Notification(...)` fails with `UNErrorDomain
  # error 1`). Leaving `identity` unset lets electron-builder fall back to
  # an ad-hoc signature (`codesign --sign -`), which the Electron docs
  # treat as "code-signed" for notification delivery.
  category: public.app-category.developer-tools
  # Hardened runtime is only meaningful when paired with notarization.
  # Combined with ad-hoc signing it adds restrictions for no benefit and
  # destabilizes local notification delivery, so we leave it off for the
  # local builder. The production `electron-builder.yml` keeps it on.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  signIgnore:
    - Contents/Resources/cadencr-service$
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  icon: icons/
  synopsis: Desktop shell for driving local AI coding agents
  executableName: cadencr

# Keep local builder in sync with the production config so smoke-testing
# distro packages doesn't require touching CI. See electron-builder.yml for
# the rationale behind the explicit depends lists.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libxkbcommon0
  priority: optional
rpm:
  depends:
    - gtk3
    - libXScrnSaver
    - libXtst
    - libnotify
    - nss
    - xdg-utils
    - at-spi2-atk
    - libdrm
    - mesa-libgbm
    - libxkbcommon
