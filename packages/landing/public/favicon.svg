<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Dash values are baked into user units (no pathLength): circumference of
       r=28 is ~175.93, so the canonical "pathLength=360" arcs scale by ~0.4887.
       This renders identically in browsers and in raster (sharp/resvg) -->
  <rect width="100" height="100" fill="#1f2230"/>
  <circle cx="50" cy="50" r="16" fill="#b388ff"/>
  <g transform="rotate(-90 50 50)">
    <circle cx="50" cy="50" r="28" fill="none" stroke="#454f63" stroke-width="5" stroke-linecap="round" stroke-dasharray="4.887 9.774"/>
    <circle cx="50" cy="50" r="28" fill="none" stroke="#b2ff59" stroke-width="5" stroke-linecap="round" stroke-dasharray="19.548 156.382" transform="rotate(240 50 50)"/>
    <circle cx="50" cy="50" r="28" fill="none" stroke="#80d8ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="19.548 156.382" transform="rotate(60 50 50)"/>
  </g>
</svg>
