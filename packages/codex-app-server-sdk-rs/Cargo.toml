[package]
name = "codex-app-server-sdk-rs"
version = "0.2.0"
edition = "2021"
license.workspace = true

[dependencies]
cli-discovery = { path = "../cli-discovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
