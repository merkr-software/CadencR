[package]
name = "claude-agent-sdk-rs"
version = "0.6.1"
edition = "2021"
license.workspace = true

[dependencies]
cli-discovery = { path = "../cli-discovery" }
once_cell = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
pin-project-lite = "0.2"
tracing = "0.1"
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
