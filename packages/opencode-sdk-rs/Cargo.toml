[package]
name = "opencode-sdk-rs"
version = "0.2.0"
edition = "2021"
license.workspace = true

[dependencies]
cli-discovery = { path = "../cli-discovery" }
once_cell = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tempfile = "3"

[lints]
workspace = true
