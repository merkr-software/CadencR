[workspace]
members = [
    "packages/service",
    "packages/claude-agent-sdk-rs",
    "packages/cli-discovery",
    "packages/codex-app-server-sdk-rs",
    "packages/cursor-agent-sdk-rs",
    "packages/opencode-sdk-rs",
    "packages/provider-plugin-sdk-rs",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
bon = "3.9"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false

[profile.test.package."*"]
debug = false

[profile.test-debug]
inherits = "test"
debug = "line-tables-only"

# Shrink the packaged `cadencr-service` sidecar (~41 MB → ~22-28 MB). Note we
# deliberately keep `panic = "unwind"` (the default) — the service relies on
# catching panics at task boundaries.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
