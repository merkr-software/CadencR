[workspace]
members = [
    "packages/cli",
    "packages/plugin-core",
    "packages/registry-core",
    "packages/registry-publisher",
    "packages/service",
    "packages/claude-agent-sdk-rs",
    "packages/cli-discovery",
    "packages/codex-app-server-sdk-rs",
    "packages/opencode-sdk-rs",
    "packages/provider-plugin-sdk-rs",
    "packages/tab-backend-sdk-rs",
    "plugins/providers/cursor",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
bon = "3.9"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

# Disable incremental compilation to avoid accumulating several GB of cache
# per worktree across development, test, and clippy builds.
[profile.dev]
debug = false
incremental = false
# Cargo otherwise strips debuginfo implicitly when debug is disabled. Rust/LLVM
# can misalign Mach-O dylibs during stripping, so macOS 27 rejects proc macros.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"

[profile.test]
debug = false
incremental = false

[profile.test.package."*"]
debug = false
# A package override's `debug = false` re-arms the implicit strip for every
# dependency, proc macros included; see [profile.dev].
strip = "none"

[profile.test-debug]
inherits = "test"
debug = "line-tables-only"

# Shrink the packaged `cadencr-service` sidecar (~41 MB → ~22-28 MB). Note we
# deliberately keep `panic = "unwind"` (the default) — the service relies on
# catching panics at task boundaries.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

# Proc macros must load on the build host; only strip the shipped binaries.
[profile.release.build-override]
strip = "none"
