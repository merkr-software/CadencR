name: Dependency audit

on:
  # The audit reads only the lockfile and workspace settings, so PRs that do
  # not touch them cannot change its result. Pushes, tags and the daily
  # schedule still audit every revision against newly published advisories.
  # Not a required check on main, so a PR the filter skips never blocks.
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "**/package.json"
      - ".npmrc"
      - "patches/**"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
      - "v*"
    tags:
      - "v*"
  schedule:
    # Catch advisories published after a dependency was merged.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enable pnpm from packageManager
        run: corepack enable

      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          # Audit reads the lockfile without installing or populating a store.
          package-manager-cache: false

      - name: Audit all production and development dependencies
        run: pnpm audit --audit-level=low
