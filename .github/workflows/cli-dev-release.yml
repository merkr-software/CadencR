name: Release development CLI

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed canonical main commit SHA (must still be main tip)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-dev-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'merkr-software/CadencR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Fetch canonical main without checkout
        run: git fetch --no-tags https://github.com/merkr-software/CadencR.git main:refs/remotes/origin/main
      - name: Require reviewed main tip and successful canonical CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-dev-release.mts gate
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Test version helpers
        run: node --test scripts/cli-dev-release.test.mts
      - name: Test CLI and supporting crates
        env:
          CADENCR_CLI_RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          node scripts/cargo-env.mjs cargo test --locked -p cadencr-cli -p cadencr-plugin-core -p cadencr-registry-core -p cadencr-registry-publisher
      - name: Build and package Linux CLI only
        env:
          CADENCR_CLI_RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          node scripts/cargo-env.mjs cargo build --locked --release -p cadencr-cli --target x86_64-unknown-linux-gnu
          bash scripts/package-cli-release.sh "v$VERSION" x86_64-unknown-linux-gnu target/x86_64-unknown-linux-gnu/release/cadencr dist-cli
      - name: Record source-bound candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cli-dev-release.mts metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-cli/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout: neither source scripts nor the candidate binary execute with a write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cli-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Validate candidate without executing it
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          p = pathlib.Path('candidate')
          version, tag = os.environ['VERSION'], os.environ['TAG']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev\.[1-9][0-9]*\.[1-9][0-9]*', version)
          assert version.endswith('-dev.' + os.environ['GITHUB_RUN_ID'] + '.' + os.environ['GITHUB_RUN_ATTEMPT'])
          assert tag == 'cli/v' + version
          asset = 'cadencr-v' + version + '-x86_64-unknown-linux-gnu'
          sums = 'cadencr-v' + version + '-SHA256SUMS'
          assert {f.name for f in p.iterdir()} == {asset, sums, 'released-cli.env', 'provenance.json'}
          assert all(f.is_file() and not f.is_symlink() for f in p.iterdir())
          assert 64 <= (p / asset).stat().st_size <= 128 * 1024 * 1024
          binary = (p / asset).read_bytes()
          assert binary[:6] == b'\x7fELF\x02\x01' and binary[18:20] == b'\x3e\x00'
          digest = hashlib.sha256(binary).hexdigest()
          assert (p / sums).read_text() == digest + '  ' + asset + '\n'
          assert (p / 'released-cli.env').read_text() == f'CADENCR_RELEASE_VERSION={version}\nCADENCR_RELEASE_TAG={tag}\nCADENCR_RELEASE_SHA256={digest}\n'
          data = json.loads((p / 'provenance.json').read_text())
          assert data == dict(repository='merkr-software/CadencR', source_commit=os.environ['SOURCE_COMMIT'], version=version, tag=tag, run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], workflow='.github/workflows/cli-dev-release.yml', asset=asset, sha256=digest)
          PY
      - name: Publish new immutable CLI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: merkr-software/CadencR
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # An API error other than a definitive 404 must fail closed.
          for endpoint in "git/ref/tags/$TAG" "releases/tags/$TAG"; do
            status=$(gh api --include "repos/$GH_REPO/$endpoint" 2>&1) && { echo "Refusing existing tag or release"; exit 1; }
            printf '%s\n' "$status" | grep -q 'HTTP 404' || { printf '%s\n' "$status"; exit 1; }
          done
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_COMMIT"
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_COMMIT" > /dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | select(.type == "commit") | .sha')" = "$SOURCE_COMMIT"
          gh release create "$TAG" candidate/* --repo "$GH_REPO" --target "$SOURCE_COMMIT" --verify-tag \
            --title "CLI development $VERSION" --draft --prerelease --latest=false \
            --notes "CLI-only development candidate. Source: $SOURCE_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT). Not a desktop release or qualification pin update."
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | select(.type == "commit") | .sha')" = "$SOURCE_COMMIT"
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,targetCommitish \
            --jq 'select(.isDraft == true and .isPrerelease == true) | .targetCommitish' | grep -Fx "$SOURCE_COMMIT"
          gh release download "$TAG" --repo "$GH_REPO" --dir downloaded
          test "$(ls -1 downloaded | wc -l)" -eq 4
          for asset in candidate/*; do cmp "$asset" "downloaded/$(basename "$asset")"; done
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
