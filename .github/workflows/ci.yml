name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  precommit-checks:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enable pnpm from packageManager
        run: corepack enable

      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the Rust tests on their own, before the Turbo pipeline. Turbo
      # buffers each task's output until it finishes, so a hanging test leaves
      # no trace in the log — it just burns the job timeout in silence. A
      # dedicated step with `--nocapture` streams progress and names the test
      # that stalls, and the short step timeout fails fast instead of at 45m.
      - name: Rust tests
        timeout-minutes: 20
        run: pnpm --filter @cadencr/service test -- --nocapture

      - name: Run pre-commit checks
        run: |
          pnpm run test:release-scripts
          pnpm turbo run format:check lint ts-check knip --log-order=stream
          # @cadencr/service already ran in the "Rust tests" step above —
          # exclude it here so cargo test doesn't run twice.
          pnpm turbo run test --filter='!@cadencr/service' --log-order=stream
