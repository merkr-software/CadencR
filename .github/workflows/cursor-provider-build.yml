name: Build and qualify native provider release artifacts

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Native provider to build and qualify
        type: choice
        default: cursor
        options: [cursor, antigravity]
  push:
    branches: ["release/cursor-*", "release/antigravity-*"]
    tags: ["plugins/provider-cursor/v*", "plugins/provider-antigravity/v*"]

permissions:
  contents: read

env:
  PROVIDER: ${{ inputs.provider || ((startsWith(github.ref, 'refs/heads/release/antigravity-') || startsWith(github.ref, 'refs/tags/plugins/provider-antigravity/')) && 'antigravity') || 'cursor' }}

jobs:
  native:
    name: Native provider connector (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            runner: macos-26
          - target: darwin-x86_64
            runner: macos-15-intel
          # Match the glibc baseline of the Linux desktop release.
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
          - target: linux-x86_64
            runner: ubuntu-22.04
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm and install pinned Rust toolchain
        run: |
          corepack enable
          rustup toolchain install
      - name: Test native connector
        run: pnpm rust -- test --locked -p "cadencr-plugin-provider-$PROVIDER"
      - name: Build distribution payload
        run: node "plugins/providers/$PROVIDER/scripts/package.mjs" --directory "$RUNNER_TEMP/provider-payload"
      - name: Exercise exact distribution executable with scripted upstream CLI
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 "plugins/providers/$PROVIDER/scripts/qualify.py" \
            --binary "$RUNNER_TEMP/provider-payload/bin/provider" \
            --target "$TARGET" --source-commit "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/provider-payload/qualification.json"
      # No credentials, environment, signing or publication in this workflow.
      # The protected author workflow binds each artifact to this exact run/SHA.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROVIDER }}-native-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/provider-payload/
          if-no-files-found: error
          retention-days: 30

  prepare:
    name: Prepare inert release candidate
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PROVIDER }}-native-*-${{ github.sha }}
          path: ${{ runner.temp }}/provider-native
      - name: Package and validate using the reviewed released CLI
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          sh tooling/marketplace-registry/scripts/ci/fetch-released-cli.sh \
            scripts/official-plugin-author-cli.env "$RUNNER_TEMP/provider-cli" > /dev/null
          python3 scripts/native_provider_release_prepare.py --provider "$PROVIDER" \
            --input "$RUNNER_TEMP/provider-native" --output "$RUNNER_TEMP/provider-candidate" \
            --source-repo "$GITHUB_WORKSPACE" --source-commit "$SOURCE_COMMIT" \
            --cli "$RUNNER_TEMP/provider-cli/cadencr"
          "$RUNNER_TEMP/provider-cli/cadencr" plugin inspect-release \
            --request "$RUNNER_TEMP/provider-candidate/request.json" --directory "$RUNNER_TEMP/provider-candidate" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROVIDER }}-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/provider-candidate/
          if-no-files-found: error
          retention-days: 30
