name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # afterSign hook gates on this; opt in for tagged releases only.
      CADENCR_NOTARIZE_APP: "true"
      # Apple ID credentials consumed by build/notarize-app.cjs and
      # scripts/notarize-artifacts.mjs.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # electron-builder reads CSC_LINK + CSC_KEY_PASSWORD to import the
      # Developer ID Application certificate from a base64-encoded .p12.
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      # GitHub publish provider — needs write access to releases.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PAT with write access to the merkr-software/homebrew-cadencr tap. When
      # unset, the cask-update step is skipped (see its `if` guard).
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Test Homebrew cask update script
        run: env -u BASH_ENV bash scripts/update-homebrew-cask.test.sh

      - name: Enable pnpm from packageManager
        run: corepack enable

      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const pkg=require('./packages/desktop/package.json'); const expected='v'+pkg.version; const actual=process.env.GITHUB_REF_NAME; if (actual !== expected) { console.error('Release tag '+actual+' does not match desktop version '+expected); process.exit(1); }"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Rust service sidecar
        run: pnpm --filter @cadencr/service build

      - name: Verify service sidecar runtime dependencies
        run: pnpm --filter @cadencr/service check:macos-runtime-deps

      - name: Smoke test packaged service sidecar startup
        run: pnpm --filter @cadencr/service smoke:packaged-sidecar

      - name: Build renderer + main bundles
        run: pnpm --filter @cadencr/desktop exec electron-vite build

      - name: Prepare GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_retryable="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '.isDraft or (.assets | length == 0)')"
            if [ "$is_retryable" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists with assets. Refusing to overwrite it." >&2
              exit 1
            fi

            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Import Developer ID certificate
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/cadencr-build-signing.keychain-db"

          echo "$CSC_LINK" | base64 -D > "$certificate_path"
          security create-keychain -p "$CSC_KEY_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$CSC_KEY_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity found in signing keychain" >&2
            exit 1
          fi

          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "CADENCR_MAC_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and publish desktop app
        # `releaseType: draft` lets electron-builder upload all multi-arch
        # assets before GitHub marks the final release immutable.
        run: |
          pnpm --filter @cadencr/desktop exec electron-builder \
            --config electron-builder.yml \
            --mac \
            --arm64 --x64 \
            --publish always

      - name: Extract GitHub release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft=false \
            --latest

      - name: Update Homebrew cask
        # Pushes the refreshed cask to the merkr-software/homebrew-cadencr tap.
        # Skipped until the HOMEBREW_TAP_TOKEN secret (write access to that repo)
        # is configured.
        if: startsWith(github.ref, 'refs/tags/') && env.HOMEBREW_TAP_TOKEN != ''
        run: scripts/update-homebrew-cask.sh "$GITHUB_REF_NAME"
