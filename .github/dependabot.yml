version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match pnpm's 14-day minimumReleaseAge policy. Dependabot security
    # updates are not subject to cooldowns and can still open immediately.
    cooldown:
      default-days: 14
    groups:
      # Group only minor/patch bumps together. Major (breaking) updates get
      # their own PRs so risky migrations (e.g. react-query v5, TypeScript
      # majors) are reviewed and merged deliberately rather than bundled into
      # one large group PR.
      npm-and-yarn:
        # Keep this group limited to scheduled version updates. Security
        # updates must remain independent so Dependabot updates each pnpm
        # workspace dependency from the root lockfile instead of trying to
        # refresh a cross-directory group from workspace subdirectories.
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: reqwest
        versions:
          - "0.13.x"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
