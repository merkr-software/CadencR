packages:
  - "packages/*"

nodeLinker: hoisted
engineStrict: true
nodeVersion: 22.18.0

minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Emergency security fix for CVE-2026-44705; tmp <0.2.6 is vulnerable.
  - "tmp@0.2.6"
  # Security fixes needed for the v0.10.0 build. These exact versions are
  # allowed through the age gate so patched transitive dependencies can land
  # immediately without weakening the policy for unrelated packages.
  - "brace-expansion@1.1.17 || 2.1.3 || 5.0.8"
  - "dompurify@3.4.12"
  - "fast-uri@3.1.4"
  - "immutable@4.3.9"
  - "js-yaml@4.3.0"
  - "linkify-it@5.0.2"
  - "lodash-es@4.18.0"
  - "markdown-it@14.2.0"
  - "nanoid@3.3.8 || 5.0.9"
  - "postcss@8.5.18"
  - "svgo@4.0.2"
  - "tar@7.5.21"
  - "undici@7.28.0"
  # Security updates (PR #62): vite 6.4.3 patches GHSA-fx2h-pf6j-xcff (HIGH,
  # server.fs.deny bypass) + GHSA-v6wh-96g9-6wx3; astro 6.4.6 patches
  # GHSA-2pvr-wf23-7pc7 (HIGH, Host-header SSRF) + GHSA-jrpj-wcv7-9fh9. The
  # upgrade pulls fresh transitive deps (rollup 4.62.2 binaries, @clack/* 1.x,
  # etc.) that trip the 14-day gate; excluded so the patches land now.
  # TEMPORARY: remove all entries below once they age past minimumReleaseAge
  # (publish dates ~2026-06-19, so safe to drop after ~2026-07-03).
  - "vite@6.4.3"
  - "vite@7.3.5"
  - "astro@6.4.6"
  - "rollup@4.62.2"
  - "obug@2.1.3"
  - "semver@7.8.5"
  - "@clack/core@1.4.2"
  - "@clack/prompts@1.6.0"
  - "@capsizecss/unpack@4.0.1"
  - "@emnapi/runtime@1.11.1"
  - "@rollup/rollup-android-arm-eabi@4.62.2"
  - "@rollup/rollup-android-arm64@4.62.2"
  - "@rollup/rollup-darwin-arm64@4.62.2"
  - "@rollup/rollup-darwin-x64@4.62.2"
  - "@rollup/rollup-freebsd-arm64@4.62.2"
  - "@rollup/rollup-freebsd-x64@4.62.2"
  - "@rollup/rollup-linux-arm-gnueabihf@4.62.2"
  - "@rollup/rollup-linux-arm-musleabihf@4.62.2"
  - "@rollup/rollup-linux-arm64-gnu@4.62.2"
  - "@rollup/rollup-linux-arm64-musl@4.62.2"
  - "@rollup/rollup-linux-loong64-gnu@4.62.2"
  - "@rollup/rollup-linux-loong64-musl@4.62.2"
  - "@rollup/rollup-linux-ppc64-gnu@4.62.2"
  - "@rollup/rollup-linux-ppc64-musl@4.62.2"
  - "@rollup/rollup-linux-riscv64-gnu@4.62.2"
  - "@rollup/rollup-linux-riscv64-musl@4.62.2"
  - "@rollup/rollup-linux-s390x-gnu@4.62.2"
  - "@rollup/rollup-linux-x64-gnu@4.62.2"
  - "@rollup/rollup-linux-x64-musl@4.62.2"
  - "@rollup/rollup-openbsd-x64@4.62.2"
  - "@rollup/rollup-openharmony-arm64@4.62.2"
  - "@rollup/rollup-win32-arm64-msvc@4.62.2"
  - "@rollup/rollup-win32-ia32-msvc@4.62.2"
  - "@rollup/rollup-win32-x64-gnu@4.62.2"
  - "@rollup/rollup-win32-x64-msvc@4.62.2"
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Older packages often predate registry trust evidence; keep downgrade checks
# focused on packages published in the last year.
trustPolicyIgnoreAfter: 525600

overrides:
  "@stoplight/spectral-functions": 1.10.2
  "@stoplight/spectral-rulesets": 1.22.2
  "brace-expansion@>=1.0.0 <1.1.17": 1.1.17
  "brace-expansion@>=2.0.0 <2.1.3": 2.1.3
  "brace-expansion@>=5.0.0 <5.0.8": 5.0.8
  "dompurify@>=3.0.0 <3.4.12": 3.4.12
  "fast-uri@>=3.0.0 <3.1.4": 3.1.4
  "immutable@>=4.0.0 <4.3.9": 4.3.9
  "js-yaml@>=4.0.0 <4.3.0": 4.3.0
  "linkify-it@>=5.0.0 <5.0.2": 5.0.2
  "lodash-es@>=4.0.0 <4.18.0": 4.18.0
  "markdown-it@>=14.0.0 <14.2.0": 14.2.0
  "nanoid@>=3.0.0 <3.3.8": 3.3.8
  # Upstream pins vulnerable Nano ID 4.0.2 exactly. Scope the required v5
  # replacement to its ESM consumer instead of rewriting every Nano ID edge.
  "@excalidraw/mermaid-to-excalidraw@2.2.2>nanoid": 5.0.9
  "postcss@>=8.0.0 <8.5.18": 8.5.18
  "sharp@>=0.35.0 <0.35.3": 0.35.3
  "svgo@>=4.0.0 <4.0.2": 4.0.2
  "tar@>=7.0.0 <=7.5.20": 7.5.21
  "undici@>=7.0.0 <7.28.0": 7.28.0
  volar-service-yaml: 0.0.71

allowBuilds:
  # Keep dependency lifecycle scripts disabled by default. If a package truly
  # needs install-time native setup, review it explicitly before flipping it.
  electron-winstaller: false
  esbuild: false
  msw: false
  sharp: false

patchedDependencies:
  '@pierre/trees@1.0.0-beta.4': patches/@pierre__trees@1.0.0-beta.4.patch
