packages:
  - "packages/*"

nodeLinker: hoisted
engineStrict: true
nodeVersion: 22.19.0

minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # GHSA-p98j-92pf-mc4p: use the fixed sanitizer release.
  # Remove after 2026-10-07T15:29:57Z (14 days after publication).
  - "dompurify@3.4.16"
  # First-party dependency, published from a repository we control
  # (github.com/edjubert/celeritty). The 14-day soak exists to catch a
  # compromised upstream release; it does not apply to a package whose
  # source, CI and publishing key are ours. Keep this entry permanently
  # rather than churning it on every release.
  - "celeritty"
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Older packages often predate registry trust evidence; keep downgrade checks
# focused on packages published in the last year.
trustPolicyIgnoreAfter: 525600

overrides:
  "@stoplight/spectral-functions": 1.10.2
  "@stoplight/spectral-rulesets": 1.22.2
  "@xmldom/xmldom@>=0.8.0 <0.8.15": 0.8.15
  "baseline-browser-mapping@>=2.0.0 <2.11.0": 2.11.0
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "browserslist@>=4.0.0 <4.28.7": 4.28.7
  "devalue@>=5.0.0 <5.9.2": 5.9.2
  "dompurify@>=3.0.0 <3.4.16": 3.4.16
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "immutable@>=4.0.0 <4.3.9": 4.3.9
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "linkify-it@>=5.0.0 <5.0.2": 5.0.2
  "lodash-es@>=4.0.0 <4.18.0": 4.18.0
  "markdown-it@>=14.0.0 <14.3.1": 14.3.1
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  # Upstream pins vulnerable Nano ID 4.0.2 exactly. Scope the required v5
  # replacement to its ESM consumer instead of rewriting every Nano ID edge.
  "@excalidraw/mermaid-to-excalidraw@2.2.2>nanoid": 5.1.16
  "postcss@>=8.0.0 <8.5.23": 8.5.23
  "sharp@>=0.35.0 <0.35.4": 0.35.4
  "smol-toml@>=1.0.0 <1.7.1": 1.7.1
  "svgo@>=4.0.0 <4.1.0": 4.1.0
  "tar@>=7.0.0 <=7.5.20": 7.5.21
  "undici@>=6.0.0 <6.28.1": 6.28.1
  "undici@>=7.0.0 <7.29.1": 7.29.1
  "undici@>=8.0.0 <8.10.2": 8.10.2
  volar-service-yaml: 0.0.71

allowBuilds:
  # Keep dependency lifecycle scripts disabled by default. If a package truly
  # needs install-time native setup, review it explicitly before flipping it.
  electron-winstaller: false
  esbuild: false
  msw: false
  sharp: false

patchedDependencies:
  "@pierre/trees@1.0.0-beta.4": patches/@pierre__trees@1.0.0-beta.4.patch
