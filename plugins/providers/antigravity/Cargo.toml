[package]
name = "cadencr-plugin-provider-antigravity"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Cadencr provider connector for the Google Antigravity CLI"
publish = false

[[bin]]
name = "cadencr-antigravity-provider"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "3.4.0"
bon.workspace = true
cadencr-provider-sdk = { path = "../../../packages/provider-plugin-sdk-rs", version = "0.3" }
cli-discovery = { path = "../../../packages/cli-discovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "signal",
  "time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
